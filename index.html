<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: linear-gradient(135deg,#f5f7fa,#e9eef5); color:#1f2937; min-height:100vh; }

  .search input { width:100%; padding:12px 16px; font-size:15px; border:1px solid #d1d5db;
                   border-radius:10px; outline:none; }
  .search input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .grid { max-width:1080px; margin:18px auto 60px; padding:0 24px;
          display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .card { display:block; position:relative; text-decoration:none; color:#1f2937;
          background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:18px 16px;
          transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card:hover { transform:translateY(-2px); border-color:#3b82f6; box-shadow:0 6px 18px rgba(59,130,246,.15); }
  .card.main { border-color:#3b82f6; background:#f0f6ff; }
  .card .name { font-size:15px; font-weight:500; word-break:break-all; }
  .badge { position:absolute; top:-8px; right:12px; background:#3b82f6; color:#fff;
           font-size:11px; padding:2px 8px; border-radius:999px; }
  .count { text-align:center; color:#9ca3af; font-size:13px; margin-bottom:8px; }
</style>
</head>

<script>
  function filter() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var cards = document.querySelectorAll('#grid .card');
    var n = 0;
    cards.forEach(function(c){
      var name = c.querySelector('.name').textContent.toLowerCase();
      var show = name.indexOf(q) > -1;
      c.style.display = show ? '' : 'none';
      if (show) n++;
    });
    document.getElementById('count').textContent = '匹配 ' + n + ' / 13';
  }
  filter();
</script>
