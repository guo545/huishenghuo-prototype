<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申请结算</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: #f5f5f5;
            color: #333;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 667px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            background: linear-gradient(180deg, #FFF9E6 0%, #fff 100%);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 16px 10px;
            font-size: 14px;
            font-weight: 500;
        }

        /* 页面主体 */
        .page-body {
            height: calc(667px - 44px);
            overflow-y: auto;
            background: #f5f5f5;
        }

        /* 顶部导航 */
        .page-header {
            height: 44px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            font-size: 24px;
            color: #333;
            cursor: pointer;
            padding: 4px 8px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }

        .header-right {
            width: 40px;
        }

        /* 模块区域 */
        .section-card {
            margin: 12px;
            background: #fff;
            border-radius: 12px;
            padding: 16px;
        }

        /* 模块1：结算银行卡信息 */
        .bank-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
        }

        .bank-label {
            font-size: 14px;
            color: #666;
        }

        .bank-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bank-name {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .bank-arrow {
            font-size: 16px;
            color: #ccc;
        }

        /* 模块2：结算金额 */
        .amount-section {
            padding: 4px 0 12px;
        }

        .amount-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .amount-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .amount-symbol {
            font-size: 24px;
            color: #333;
            font-weight: 600;
            line-height: 1;
        }

        .amount-input {
            flex: 1;
            font-size: 24px;
            color: #333;
            font-weight: 600;
            border: none;
            outline: none;
            background: transparent;
            caret-color: #FA8C16;
            min-width: 0;
        }

        .amount-input::placeholder {
            color: #ddd;
        }

        .all-btn {
            font-size: 13px;
            color: #FA8C16;
            background: #FFF7E6;
            padding: 4px 10px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .amount-hint {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hint-label {
            font-size: 12px;
            color: #999;
        }

        .hint-value {
            font-size: 12px;
            color: #FA8C16;
            font-weight: 500;
        }

        /* 模块3：到账方式 */
        .settle-type-section {
            padding: 4px 0;
        }

        .settle-type-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 0;
        }

        .settle-type-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #FA8C16;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .radio-circle.selected::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FA8C16;
        }

        .type-name {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }

        .type-tag {
            font-size: 11px;
            color: #fff;
            background: #FA8C16;
            padding: 2px 6px;
            border-radius: 8px;
            margin-left: 6px;
        }

        .type-tag.disabled {
            background: #ccc;
        }

        .type-desc {
            font-size: 12px;
            color: #999;
            margin-left: 4px;
        }

        .fee-info {
            font-size: 13px;
            color: #999;
        }

        /* D0服务广告位 */
        .d0-ad-card {
            margin: 12px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #FFF3C4 0%, #FFE99A 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .d0-ad-left {
            flex: 1;
        }

        .d0-ad-title {
            font-size: 15px;
            font-weight: 600;
            color: #8B5E1A;
            margin-bottom: 4px;
        }

        .d0-ad-subtitle {
            font-size: 12px;
            color: #B5860A;
        }

        .d0-ad-btn {
            background: #F5A623;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>信号 Wi-Fi 电池</span>
        </div>

        <!-- 页面主体 -->
        <div class="page-body">
            <!-- 顶部导航 -->
            <div class="page-header">
                <span class="back-btn">‹</span>
                <span class="header-title">申请结算</span>
                <span class="header-right"></span>
            </div>

            <!-- 模块1：结算银行卡信息 -->
            <div class="section-card">
                <div class="bank-row">
                    <span class="bank-label">结算至</span>
                    <div class="bank-info">
                        <span class="bank-name">中国银行5678</span>
                        <span class="bank-arrow">›</span>
                    </div>
                </div>
            </div>

            <!-- 模块2：结算金额 -->
            <div class="section-card">
                <div class="amount-section">
                    <div class="amount-label">结算金额</div>
                    <div class="amount-input-row">
                        <span class="amount-symbol">¥</span>
                        <input type="text" class="amount-input" placeholder="0.00" />
                        <button class="all-btn">全部</button>
                    </div>
                    <div class="amount-hint">
                        <span class="hint-label">可结算金额：</span>
                        <span class="hint-value">¥0.00</span>
                    </div>
                </div>
            </div>

            <!-- 模块3：到账方式 -->
            <div class="section-card">
                <div class="settle-type-section">
                    <div class="settle-type-row">
                        <div class="settle-type-left">
                            <div class="radio-circle selected"></div>
                            <span class="type-name">普通到账</span>
                            <span class="type-tag">今日可提</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- D0服务广告位 -->
            <div class="d0-ad-card">
                <div class="d0-ad-left">
                    <div class="d0-ad-title">开通专属资金快速到账权益</div>
                    <div class="d0-ad-subtitle">当天收款当天提现，节假日不延迟到账</div>
                </div>
                <button class="d0-ad-btn">立即开通</button>
            </div>
        </div>
    </div>
</body>
</html>
