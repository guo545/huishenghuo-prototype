<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>管家APP 普通结算设置 — 付款周期</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#f5f5f5;color:#333;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px}

/* ===== 手机外框 ===== */
.phone-frame{width:375px;height:750px;background:#fff;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone-frame .notch{height:44px;background:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 6px;font-size:14px;font-weight:600;flex-shrink:0}
.phone-frame .home-indicator{height:20px;display:flex;align-items:flex-end;justify-content:center;flex-shrink:0;background:#fff}
.phone-frame .home-indicator span{width:134px;height:5px;background:#000;border-radius:3px;margin-bottom:8px}

/* ===== 页面主体 ===== */
.page-body{flex:1;overflow-y:auto;background:#f5f5f5}

/* 导航栏 */
.nav-bar{height:44px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0 16px;position:sticky;top:0;z-index:10;border-bottom:1px solid #f0f0f0}
.nav-bar .back{position:absolute;left:16px;font-size:22px;color:#333;cursor:pointer}
.nav-bar .title{font-size:17px;font-weight:600;color:#333}

/* 表单区域 */
.form-section{margin:12px;background:#fff;border-radius:12px;overflow:hidden}
.form-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;min-height:48px}
.form-row:last-child{border-bottom:none}
.form-row:active{background:#fafafa}
.form-row .label{font-size:15px;color:#333}
.form-row .value{display:flex;align-items:center;gap:4px;font-size:15px;color:#666}
.form-row .value .arrow{font-size:16px;color:#ccc}
.form-row .value.selected{color:#333;font-weight:500}

/* 说明提示框 */
.hint-box{margin:12px;padding:12px 14px;background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;font-size:13px;color:#a07000;line-height:1.6}
.hint-box strong{color:#614700;font-weight:600}

/* 底部保存按钮 */
.save-bar{padding:16px 16px calc(16px + env(safe-area-inset-bottom, 16px));background:#fff;position:sticky;bottom:0}
.save-btn{width:100%;padding:14px;background:#d4a056;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;text-align:center}
.save-btn:active{background:#c49040}
.save-btn:disabled{background:#e8dcc8;color:#b0a090}

/* ===== 底部弹窗 ===== */
.sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:9999;display:none;opacity:0;transition:opacity .25s}
.sheet-overlay.active{display:block;opacity:1}

.bottom-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:375px;background:#fff;border-radius:16px 16px 0 0;z-index:10000;transition:transform .3s ease;will-change:transform}
.bottom-sheet.hidden{transform:translateX(-50%) translateY(100%)}
.bottom-sheet.visible{transform:translateX(-50%) translateY(0)}

.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #f0f0f0}
.sheet-header .cancel-btn{font-size:15px;color:#999;cursor:pointer}
.sheet-header .title{font-size:16px;font-weight:600;color:#333}
.sheet-header .confirm-btn{font-size:15px;color:#d4a056;font-weight:600;cursor:pointer}

/* 单选列表 */
.option-list{max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.option-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.option-item:last-child{border-bottom:none}
.option-item:active{background:#fafafa}
.option-item .opt-label{font-size:15px;color:#333}
.option-item .opt-check{font-size:18px;color:#d4a056;width:20px;text-align:center}

/* 双列选择器 */
.dual-picker{display:flex;height:260px;overflow:hidden}
.picker-col{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 0;border-right:1px solid #f0f0f0}
.picker-col:last-child{border-right:none}
.picker-col .col-header{padding:8px 16px;font-size:13px;color:#999;font-weight:500;text-align:center;border-bottom:1px solid #f5f5f5;margin-bottom:4px}
.picker-item{padding:12px 16px;font-size:15px;color:#333;cursor:pointer;text-align:center;transition:background .15s}
.picker-item:active{background:#fafafa}
.picker-item.selected{color:#d4a056;font-weight:600;background:#fff8ee}
</style>
</head>
<body>

<div class="phone-frame">
  <!-- 状态栏 -->
  <div class="notch"><span>9:53</span><span>信号 Wi-Fi 电池</span></div>

  <!-- 页面内容 -->
  <div class="page-body">
    <!-- 导航栏 -->
    <div class="nav-bar">
      <span class="back">‹</span>
      <span class="title">普通结算设置</span>
    </div>

    <!-- 表单 -->
    <div class="form-section" id="formSection">
      <!-- 结算方式 -->
      <div class="form-row" onclick="openSettleMethodSheet()">
        <span class="label">结算方式</span>
        <div class="value selected">
          <span id="settleMethodText">自动结算</span>
          <span class="arrow">›</span>
        </div>
      </div>
      <!-- 结算产品 -->
      <div class="form-row" onclick="openSettleProductSheet()">
        <span class="label">结算产品</span>
        <div class="value selected">
          <span id="settleProductText">次自然日结算D1</span>
          <span class="arrow">›</span>
        </div>
      </div>
      <!-- 付款周期（新增） -->
      <div class="form-row" id="payCycleRow" onclick="openPayCycleSheet()">
        <span class="label">付款周期</span>
        <div class="value selected">
          <span id="payCycleText">每日结算</span>
          <span class="arrow">›</span>
        </div>
      </div>
      <!-- 到账时间 -->
      <div class="form-row" id="timeRow" onclick="openTimeSheet()">
        <span class="label">到账时间</span>
        <div class="value selected">
          <span id="timeText">10:00</span>
          <span class="arrow">›</span>
        </div>
      </div>
    </div>

    <!-- 说明提示框 -->
    <div class="hint-box">
      <strong>结算产品说明：</strong><span id="hintText"></span>
    </div>
  </div>

  <!-- 底部保存按钮 -->
  <div class="save-bar">
    <div class="save-btn" onclick="handleSave()">保存</div>
  </div>

  <!-- 导航条 -->
  <div class="home-indicator"><span></span></div>
</div>

<!-- ===== 结算方式弹窗 ===== -->
<div class="sheet-overlay" id="methodOverlay" onclick="closeSheet('method')"></div>
<div class="bottom-sheet hidden" id="methodSheet">
  <div class="sheet-header">
    <span class="cancel-btn" onclick="closeSheet('method')">取消</span>
    <span class="title">选择结算方式</span>
    <span class="confirm-btn" onclick="confirmSettleMethod()">确认</span>
  </div>
  <div class="option-list" id="methodOptions"></div>
</div>

<!-- ===== 结算产品弹窗 ===== -->
<div class="sheet-overlay" id="productOverlay" onclick="closeSheet('product')"></div>
<div class="bottom-sheet hidden" id="productSheet">
  <div class="sheet-header">
    <span class="cancel-btn" onclick="closeSheet('product')">取消</span>
    <span class="title">选择结算产品</span>
    <span class="confirm-btn" onclick="confirmSettleProduct()">确认</span>
  </div>
  <div class="option-list" id="productOptions"></div>
</div>

<!-- ===== 付款周期弹窗 ===== -->
<div class="sheet-overlay" id="cycleOverlay" onclick="closeSheet('cycle')"></div>
<div class="bottom-sheet hidden" id="cycleSheet">
  <div class="sheet-header">
    <span class="cancel-btn" onclick="closeSheet('cycle')">取消</span>
    <span class="title">选择付款周期</span>
    <span class="confirm-btn" onclick="confirmPayCycle()">确认</span>
  </div>
  <div class="option-list" id="cycleOptions"></div>
</div>

<!-- ===== 时间选择弹窗（单列/双列） ===== -->
<div class="sheet-overlay" id="timeOverlay" onclick="closeSheet('time')"></div>
<div class="bottom-sheet hidden" id="timeSheet">
  <div class="sheet-header">
    <span class="cancel-btn" onclick="closeSheet('time')">取消</span>
    <span class="title" id="timeSheetTitle">选择到账时间</span>
    <span class="confirm-btn" onclick="confirmTime()">确认</span>
  </div>
  <div id="timePickerBody"></div>
</div>

<script>
// ===== 状态 =====
var settleMethod = 'auto';
var settleProduct = 'D1';
var payCycle = 'dailySettle';
var currentTime = '10:00';
var selectedWeekday = 'monday';
var selectedMonthDay = '1';

// 临时状态（弹窗内选择但未确认）
var tmpSettleMethod = '';
var tmpSettleProduct = '';
var tmpPayCycle = '';
var tmpTime = '';
var tmpWeekday = '';
var tmpMonthDay = '';

// ===== 枚举数据 =====
var settleMethodOptions = [
  { value: 'auto', label: '自动结算' },
  { value: 'manual', label: '手动结算' }
];
var settleProductOptions = [
  { value: 'D1', label: '次自然日结算D1' },
  { value: 'T1', label: '次工作日结算T1' },
  { value: 'balance_timed', label: '历史余额 定时到账' }
];
var payCycleOptions = [
  { value: 'dailySettle', label: '每日结算' },
  { value: 'weeklySettle', label: '每周结算' },
  { value: 'monthlySettle', label: '每月结算' }
];
var weekdayOptions = [
  { value: 'monday', label: '周一' },
  { value: 'tuesday', label: '周二' },
  { value: 'wednesday', label: '周三' },
  { value: 'thursday', label: '周四' },
  { value: 'friday', label: '周五' },
  { value: 'saturday', label: '周六' },
  { value: 'sunday', label: '周日' }
];
var weekdayLabels = { monday:'周一', tuesday:'周二', wednesday:'周三', thursday:'周四', friday:'周五', saturday:'周六', sunday:'周日' };
var timeOptions = [];
for (var h = 0; h < 24; h++) { timeOptions.push((h < 10 ? '0' : '') + h + ':00'); }

// ===== 工具函数 =====
function openSheet(name) {
  var overlay = document.getElementById(name + 'Overlay');
  var sheet = document.getElementById(name + 'Sheet');
  overlay.classList.add('active');
  requestAnimationFrame(function() {
    sheet.classList.remove('hidden');
    sheet.classList.add('visible');
  });
}
function closeSheet(name) {
  var overlay = document.getElementById(name + 'Overlay');
  var sheet = document.getElementById(name + 'Sheet');
  sheet.classList.remove('visible');
  sheet.classList.add('hidden');
  overlay.classList.remove('active');
}

// ===== 渲染单列选项 =====
function renderOptionList(containerId, options, valueKey, confirmVar) {
  var container = document.getElementById(containerId);
  var html = '';
  for (var i = 0; i < options.length; i++) {
    var sel = options[i].value === window[confirmVar] ? '✓' : '';
    html += '<div class="option-item" data-value="' + options[i].value + '" onclick="pickOption(this, \'' + containerId + '\', \'' + confirmVar + '\')">' +
      '<span class="opt-label">' + options[i].label + '</span>' +
      '<span class="opt-check">' + sel + '</span></div>';
  }
  container.innerHTML = html;
}

function pickOption(el, containerId, confirmVar) {
  var items = el.parentElement.querySelectorAll('.option-item');
  for (var i = 0; i < items.length; i++) {
    items[i].querySelector('.opt-check').textContent = '';
  }
  el.querySelector('.opt-check').textContent = '✓';
  window[confirmVar] = el.getAttribute('data-value');
}

// ===== 结算方式 =====
function openSettleMethodSheet() {
  tmpSettleMethod = settleMethod;
  renderOptionList('methodOptions', settleMethodOptions, 'value', 'tmpSettleMethod');
  openSheet('method');
}
function confirmSettleMethod() {
  settleMethod = tmpSettleMethod;
  document.getElementById('settleMethodText').textContent =
    settleMethod === 'auto' ? '自动结算' : '手动结算';
  updateFormVisibility();
  closeSheet('method');
}

// ===== 结算产品 =====
function openSettleProductSheet() {
  tmpSettleProduct = settleProduct;
  renderOptionList('productOptions', settleProductOptions, 'value', 'tmpSettleProduct');
  openSheet('product');
}
function confirmSettleProduct() {
  settleProduct = tmpSettleProduct;
  var labels = { D1:'次自然日结算D1', T1:'次工作日结算T1', balance_timed:'历史余额 定时到账' };
  document.getElementById('settleProductText').textContent = labels[settleProduct];
  updateHint();
  closeSheet('product');
}

// ===== 付款周期 =====
function openPayCycleSheet() {
  tmpPayCycle = payCycle;
  renderOptionList('cycleOptions', payCycleOptions, 'value', 'tmpPayCycle');
  openSheet('cycle');
}
function confirmPayCycle() {
  payCycle = tmpPayCycle;
  var labels = { dailySettle:'每日结算', weeklySettle:'每周结算', monthlySettle:'每月结算' };
  document.getElementById('payCycleText').textContent = labels[payCycle];
  updateTimeDisplay();
  updateHint();
  closeSheet('cycle');
}

// ===== 到账时间 =====
function openTimeSheet() {
  if (settleMethod === 'manual') return;
  tmpTime = currentTime;
  tmpWeekday = selectedWeekday;
  tmpMonthDay = selectedMonthDay;

  var body = document.getElementById('timePickerBody');
  var title = document.getElementById('timeSheetTitle');

  if (payCycle === 'dailySettle') {
    // 单列时间点
    title.textContent = '选择到账时间';
    var html = '<div class="option-list" style="max-height:260px">';
    for (var i = 0; i < timeOptions.length; i++) {
      var sel = timeOptions[i] === tmpTime ? '✓' : '';
      html += '<div class="option-item" data-value="' + timeOptions[i] + '" onclick="pickOption(this, \'timePickerBody\', \'tmpTime\')">' +
        '<span class="opt-label">' + timeOptions[i] + '</span>' +
        '<span class="opt-check">' + sel + '</span></div>';
    }
    html += '</div>';
    body.innerHTML = html;
  } else if (payCycle === 'weeklySettle') {
    // 双列：周几 + 时间点
    title.textContent = '选择到账时间';
    var timeObjOpts = timeOptions.map(function(t) { return { value: t, label: t }; });
    body.innerHTML = buildDualPicker(weekdayOptions, tmpWeekday, 'tmpWeekday', timeObjOpts, tmpTime, 'tmpTime');
  } else if (payCycle === 'monthlySettle') {
    // 双列：日期 + 时间点
    title.textContent = '选择到账时间';
    var dateOpts = [];
    for (var d = 1; d <= 31; d++) { dateOpts.push({ value: String(d), label: d + '日' }); }
    var timeObjOpts = timeOptions.map(function(t) { return { value: t, label: t }; });
    body.innerHTML = buildDualPicker(dateOpts, tmpMonthDay, 'tmpMonthDay', timeObjOpts, tmpTime, 'tmpTime');
  }

  openSheet('time');
}

function buildDualPicker(leftOpts, leftVal, leftVar, rightOpts, rightVal, rightVar) {
  var leftHtml = '<div class="picker-col">';
  for (var i = 0; i < leftOpts.length; i++) {
    var val = leftOpts[i].value;
    var lbl = leftOpts[i].label;
    var sel = val === leftVal ? ' selected' : '';
    leftHtml += '<div class="picker-item' + sel + '" data-var="' + leftVar + '" data-value="' + val + '" onclick="pickPickerItem(this)">' + lbl + '</div>';
  }
  leftHtml += '</div>';

  var rightHtml = '<div class="picker-col">';
  for (var j = 0; j < rightOpts.length; j++) {
    var val = rightOpts[j].value;
    var lbl = rightOpts[j].label;
    var sel = val === rightVal ? ' selected' : '';
    rightHtml += '<div class="picker-item' + sel + '" data-var="' + rightVar + '" data-value="' + val + '" onclick="pickPickerItem(this)">' + lbl + '</div>';
  }
  rightHtml += '</div>';

  return '<div class="dual-picker">' + leftHtml + rightHtml + '</div>';
}

function pickPickerItem(el) {
  var col = el.parentElement;
  var items = col.querySelectorAll('.picker-item');
  for (var i = 0; i < items.length; i++) { items[i].classList.remove('selected'); }
  el.classList.add('selected');
  window[el.getAttribute('data-var')] = el.getAttribute('data-value');
}

function confirmTime() {
  currentTime = tmpTime;
  selectedWeekday = tmpWeekday;
  selectedMonthDay = tmpMonthDay;
  updateTimeDisplay();
  updateHint();
  closeSheet('time');
}

// ===== 显示更新 =====
function updateTimeDisplay() {
  if (payCycle === 'dailySettle') {
    document.getElementById('timeText').textContent = currentTime;
  } else if (payCycle === 'weeklySettle') {
    document.getElementById('timeText').textContent = weekdayLabels[selectedWeekday] + ' ' + currentTime;
  } else if (payCycle === 'monthlySettle') {
    document.getElementById('timeText').textContent = selectedMonthDay + '日 ' + currentTime;
  }
}

function updateFormVisibility() {
  var cycleRow = document.getElementById('payCycleRow');
  var timeRow = document.getElementById('timeRow');
  if (settleMethod === 'manual') {
    cycleRow.style.display = 'none';
    timeRow.style.display = 'none';
  } else {
    cycleRow.style.display = 'flex';
    timeRow.style.display = 'flex';
  }
}

// ===== 说明文案 =====
function updateHint() {
  if (settleMethod === 'manual') {
    document.getElementById('hintText').textContent = '';
    return;
  }
  var productLabels = { D1:'次自然日结算余额', T1:'次工作日结算余额', balance_timed:'历史余额' };
  var productSubject = productLabels[settleProduct] || '历史余额';

  var timeDesc = '';
  if (payCycle === 'dailySettle') {
    timeDesc = '每日 ' + currentTime;
  } else if (payCycle === 'weeklySettle') {
    timeDesc = '每周' + weekdayLabels[selectedWeekday] + ' ' + currentTime;
  } else if (payCycle === 'monthlySettle') {
    timeDesc = '每月' + selectedMonthDay + '日 ' + currentTime;
  }

  document.getElementById('hintText').textContent = '预计' + timeDesc + '点' + productSubject + '自动打款到账，商户按周期结算或者涉及切批时间点之后分账，建议使用此产品';
}

// ===== 保存 =====
function handleSave() {
  var methodLabel = settleMethod === 'auto' ? '自动结算' : '手动结算';
  var productLabel = { D1:'次自然日结算D1', T1:'次工作日结算T1', balance_timed:'历史余额 定时到账' }[settleProduct];
  var cycleLabel = { dailySettle:'每日结算', weeklySettle:'每周结算', monthlySettle:'每月结算' }[payCycle];
  var timeLabel = document.getElementById('timeText').textContent;

  var msg = '已保存\n结算方式：' + methodLabel + '\n结算产品：' + productLabel;
  if (settleMethod === 'auto') {
    msg += '\n付款周期：' + cycleLabel + '\n到账时间：' + timeLabel;
  }
  alert(msg);
}

// ===== 初始化 =====
window.onload = function() {
  updateFormVisibility();
  updateTimeDisplay();
  updateHint();
};
</script>

</body>
</html>
